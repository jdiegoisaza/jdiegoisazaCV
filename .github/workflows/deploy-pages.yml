name: Deploy a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Semanal (lunes 11:00 UTC): publica insignias nuevas de Credly / Skills Boost sin necesidad de push.
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /jdiegoisazaCV
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: npm ci
        run: npm ci

      # Solo hace falta para PDF nuevos sin miniatura comiteada; si falla, el build sigue.
      - name: Instalar poppler (miniaturas de certificados PDF)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Actualizar credenciales (Credly + Google Skills Boost)
        run: node scripts/fetch-credenciales.mjs

      - name: Generar cv/resume.tex (ES) y cv/resume_en.tex (EN) desde app/data/
        run: node cv/generate-tex.mjs

      - name: Compilar CV (Docker + TeX Live)
        run: |
          docker run --rm -v "${{ github.workspace }}/cv:/data" -w /data texlive/texlive:latest bash -c "
            mkdir -p ~/.fonts &&
            cp fonts/*.ttf ~/.fonts/ &&
            fc-cache -f &&
            xelatex -interaction=nonstopmode -halt-on-error resume.tex &&
            xelatex -interaction=nonstopmode -halt-on-error resume.tex &&
            xelatex -interaction=nonstopmode -halt-on-error resume_en.tex &&
            xelatex -interaction=nonstopmode -halt-on-error resume_en.tex
          "

      - name: Copiar CVs compilados a public/
        run: |
          mkdir -p public
          cp cv/resume.pdf public/CV_JuanIsaza.pdf
          cp cv/resume_en.pdf public/CV_JuanIsaza_EN.pdf

      - name: Build del sitio
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
